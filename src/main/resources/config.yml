options:
  # Automatically update the plugin (you should keep this on)
  auto-update: true

  # Enable PlaceholderAPI support (lets you get a player's HUD toggle state)
  placeholder-api-support: true

  # Use SlimefunTranslation to display translated item names
  slimefun-translation-support: true

waila:

  # When true, disables everything.
  # Highest priority, overrides the 'disabled-in' setting and player preferences.
  disabled: false

  # Worlds in which the WAILA is disabled.
  disabled-in: []

  # Where to display the HUD. Can be 'bossbar' or 'hotbar'.
  location: bossbar

  # Whether to use the block's original name colors. If false, white is used.
  use-original-colors: true

  # Color of the bossbar, must be in 'snake_case'.
  # 'inherit' will match the color of the bossbar to that of the text.
  # 'default' is white.
  bossbar-color: inherit

  # Whether cargo managers/connectors show the size of the cargo network
  show-cargo-size: true

  # Whether cargo input/output nodes show their channel
  show-cargo-channel: true

  # Whether energy regulators/connectors show the size of the energy network
  show-energy-size: true

  # Whether capacitors show the amount of energy stored
  show-energy-stored: true

  # Whether to show machine progress (supports most machines)
  show-machine-progress: true

  # Whether to show generator output (supports most generators)
  show-generator-generation: true

  # How often the WAILA updates, in Minecraft ticks
  tick-rate: 10
