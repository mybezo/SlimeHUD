name: Bug Report
description: Report a bug or problem with this plugin
labels: ["bug"]
assignees:
  - ybw0014
body:
  - type: markdown
    attributes:
      value: |
        ## Welcome to the SlimefunGuguProject issue tracker
        You are reporting a bug in SlimeHUD (block info display).
        For any comments or suggestions, please give feedback in the [QQ group](https://50l.cc/sf-qg).
        We recommend reading [this article](https://slimefun-wiki.guizhanss.cn/How-to-report-bugs) first to learn how to report bugs properly.

        <strong><i>You must fill in the fields marked with an asterisk (*)</i></strong>

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      description: Before reporting, please confirm that
      options:
        - label: You are using a version downloaded from the resource site (https://resources.guizhanss.com)
          required: true
        - label: You have verified the checksum of the downloaded file and confirmed it was downloaded completely
          required: true
        - label: You have not modified the downloaded file in any way
          required: true
        - label: You have searched the [list of known issues](https://github.com/SlimefunGuguProject/SlimeHUD/issues) and did not find the same issue
          required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: |
        Describe the issue you are reporting in detail
        Providing detailed information helps us handle the issue faster
      placeholder: Just saying "it doesn't work" doesn't help the developers find the problem.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: |
        Please describe in detail how to reproduce the issue
        If you have a video, please provide a link to it here
      placeholder: |
        1. xxx
        2. xxx
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected behavior
      description: |
        What do you think should have happened?
        Sometimes, the cause of an issue is a misunderstanding of a feature.
    validations:
      required: true

  - type: input
    id: server-log
    attributes:
      label: Server log
      description: |
        Please check whether your server log contains any errors. If it does, upload it to [https://mclo.gs](https://mclo.gs) and put the link here.
        **Do not paste the log directly here**
      placeholder: https://mclo.gs/...
    validations:
      required: false

  - type: input
    id: error-report
    attributes:
      label: Error report
      description: |
        If the server log mentions a file in `/plugins/Slimefun/error-reports` (an error report),
        please upload it to [https://mclo.gs](https://mclo.gs) and put the link here.
        **Do not paste the error report directly here**
      placeholder: https://mclo.gs/...
    validations:
      required: false

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: |
        Please run `/sf versions` in game and screenshot or paste the **full output** of the command here.
        If the command does not work, please manually provide your server software, server Minecraft version, Slimefun version, this plugin's version and your plugin list.
        If the server's Minecraft version differs from the client version used to connect, please mention that as well.
      placeholder: |
        (Paste the full output of /sf versions here, or fill it in manually)
    validations:
      required: true
