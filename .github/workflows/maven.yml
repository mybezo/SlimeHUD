name: Java CI

on:
  workflow_dispatch:
  push:
    branches:
    - master
  pull_request:
    branches:
    - master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: 25
          cache: 'maven'
      - name: Install Slimefun
        run: .github/scripts/install-slimefun.sh
      - name: Build with Maven
        run: mvn -B package -Dmaven.compiler.showDeprecation=true -Dmaven.compiler.showWarnings=true --file pom.xml
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SlimeHUD
          path: target/SlimeHUD*.jar
